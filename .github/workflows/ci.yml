name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段；
      # 若在此再写 version，action 会因「多处指定版本」直接失败
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # package.json 声明 engines >=18.17，但测试工具链（vitest 4 / vite 8）要求 Node >=20。
  # 因此 Node 18 单独跑冒烟：只验证构建产物能启动，不跑测试。
  smoke-node18:
    name: smoke (node 18 runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm build
      - run: node packages/core/bin/zqagent --version
      - run: node packages/core/bin/zqagent --help
